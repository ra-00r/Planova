<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planova - Reset Password</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Planova" />
  <meta name="theme-color" content="#0f2345" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="assets/icon-152.png" />
  <link rel="apple-touch-icon" sizes="144x144" href="assets/icon-144.png" />
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(1200px 900px at 35% 10%,#f7fbff 0%,var(--bg) 55%,#e7eefc 100%);">

  <div style="width:min(440px,95%);background:rgba(15,25,45,.92);color:#fff;border-radius:26px;border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 80px rgba(0,0,0,.35);padding:28px;">
    <div style="text-align:center;margin-bottom:22px;">
      <img src="assets/logo.png" alt="Planova" style="width:60px;height:60px;object-fit:contain;" />
      <h2 style="margin:10px 0 4px 0;font-size:22px;">Reset Password</h2>
      <p style="opacity:.75;margin:0;font-size:14px;">Enter your new password below</p>
    </div>

    <div class="notice" id="resetNotice" style="display:none;margin-bottom:14px;"></div>

    <div class="field" style="margin-bottom:14px;">
      <div class="label">New Password</div>
      <input class="input" id="newPassword" type="password" placeholder="Min 6 characters" style="background:rgba(255,255,255,.10);color:#fff;border-color:rgba(255,255,255,.18);" />
    </div>
    <div class="field" style="margin-bottom:20px;">
      <div class="label">Confirm Password</div>
      <input class="input" id="confirmPassword" type="password" placeholder="Repeat password" style="background:rgba(255,255,255,.10);color:#fff;border-color:rgba(255,255,255,.18);" />
    </div>

    <button id="btnResetSave" type="button" style="width:100%;padding:14px;border-radius:16px;border:1px solid rgba(79,141,255,.45);background:linear-gradient(135deg,rgba(79,141,255,.35),rgba(122,168,255,.30));color:#fff;font-weight:900;font-size:15px;cursor:pointer;">
      Save New Password
    </button>

    <div style="text-align:center;margin-top:16px;">
      <a href="index.html" style="color:rgba(255,255,255,.65);font-size:13px;">← Back to Planova</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://qcfnilswrabwtkitbofj.supabase.co/";
    const SUPABASE_ANON_KEY = "sb_publishable_v4TO8Lh2upbkp9byJRBgUA_PSarae05";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showNotice(msg, isError = false) {
      const el = document.getElementById("resetNotice");
      el.style.display = "block";
      el.textContent = msg;
      el.style.borderColor = isError ? "rgba(255,90,90,.35)" : "rgba(79,141,255,.35)";
      el.style.background = isError ? "rgba(255,80,80,.12)" : "rgba(79,141,255,.12)";
    }

    // Handle the token from URL
    window.addEventListener("load", async () => {
      const hash = window.location.hash;
      if (!hash.includes("access_token")) {
        showNotice("Invalid or expired reset link. Please request a new one.", true);
        document.getElementById("btnResetSave").disabled = true;
      }
    });

    document.getElementById("btnResetSave").addEventListener("click", async () => {
      const newPass = document.getElementById("newPassword").value;
      const confirmPass = document.getElementById("confirmPassword").value;

      if (!newPass || newPass.length < 6) {
        showNotice("Password must be at least 6 characters.", true);
        return;
      }
      if (newPass !== confirmPass) {
        showNotice("Passwords don't match.", true);
        return;
      }

      showNotice("Saving...");
      try {
        const { error } = await sb.auth.updateUser({ password: newPass });
        if (error) throw error;
        showNotice("Password updated successfully! Redirecting...");
        setTimeout(() => location.href = "index.html", 2000);
      } catch (err) {
        showNotice(err?.message || "Failed to update password.", true);
      }
    });
  </script>
</body>
</html>
