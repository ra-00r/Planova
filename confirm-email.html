<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planova - Confirm Email</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(1200px 900px at 35% 10%,#f7fbff 0%,var(--bg) 55%,#e7eefc 100%);">

  <div style="width:min(460px,95%);background:rgba(15,25,45,.92);color:#fff;border-radius:26px;border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 80px rgba(0,0,0,.35);padding:32px;text-align:center;">

    <img src="assets/logo.png" alt="Planova" style="width:64px;height:64px;object-fit:contain;margin-bottom:16px;" />

    <!-- Loading state -->
    <div id="stateLoading">
      <div style="font-size:36px;margin-bottom:12px;">⏳</div>
      <h2 style="margin:0 0 8px 0;">Confirming your email...</h2>
      <p style="opacity:.7;margin:0;">Please wait a moment.</p>
    </div>

    <!-- Success state -->
    <div id="stateSuccess" style="display:none;">
      <div style="font-size:48px;margin-bottom:12px;">🎉</div>
      <h2 style="margin:0 0 8px 0;font-size:24px;">Email Confirmed!</h2>
      <p style="opacity:.85;margin:0 0 20px 0;">Your account is ready. Welcome to Planova!</p>
      <button onclick="location.href='index.html'" style="width:100%;padding:14px;border-radius:16px;border:1px solid rgba(79,141,255,.45);background:linear-gradient(135deg,rgba(79,141,255,.35),rgba(122,168,255,.30));color:#fff;font-weight:900;font-size:15px;cursor:pointer;">
        Go to Dashboard →
      </button>
    </div>

    <!-- Error state -->
    <div id="stateError" style="display:none;">
      <div style="font-size:48px;margin-bottom:12px;">❌</div>
      <h2 style="margin:0 0 8px 0;font-size:22px;">Link Expired</h2>
      <p style="opacity:.75;margin:0 0 20px 0;" id="errorMsg">This confirmation link has expired or is invalid.</p>
      <button onclick="location.href='index.html'" style="width:100%;padding:14px;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.10);color:#fff;font-weight:900;font-size:15px;cursor:pointer;margin-bottom:10px;">
        ← Back to Planova
      </button>
      <p style="opacity:.6;font-size:12px;margin:8px 0 0 0;">Try signing up again or contact support at raghdq111@gmail.com</p>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://qcfnilswrabwtkitbofj.supabase.co/";
    const SUPABASE_ANON_KEY = "sb_publishable_v4TO8Lh2upbkp9byJRBgUA_PSarae05";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const PLANOVA_SESSION_KEY = "planova.session.v1";

    function show(id) {
      ["stateLoading","stateSuccess","stateError"].forEach(s => {
        document.getElementById(s).style.display = s === id ? "block" : "none";
      });
    }

    window.addEventListener("load", async () => {
      // Supabase puts tokens in URL hash
      const hash = window.location.hash;

      if (!hash || !hash.includes("access_token")) {
        // Maybe it's in search params (newer Supabase versions)
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");
        const type = params.get("type");

        if (token && type === "signup") {
          try {
            const { data, error } = await sb.auth.verifyOtp({ token_hash: token, type: "signup" });
            if (error) throw error;
            if (data?.session) {
              localStorage.setItem(PLANOVA_SESSION_KEY, JSON.stringify({
                access_token: data.session.access_token,
                refresh_token: data.session.refresh_token,
              }));
            }
            show("stateSuccess");
            setTimeout(() => location.href = "index.html", 2500);
          } catch (err) {
            document.getElementById("errorMsg").textContent = err.message || "Confirmation failed.";
            show("stateError");
          }
          return;
        }

        show("stateError");
        return;
      }

      try {
        // Let Supabase handle the hash automatically
        const { data, error } = await sb.auth.getSession();

        if (error) throw error;

        if (data?.session) {
          // Save session
          localStorage.setItem(PLANOVA_SESSION_KEY, JSON.stringify({
            access_token: data.session.access_token,
            refresh_token: data.session.refresh_token,
          }));
          show("stateSuccess");
          setTimeout(() => location.href = "index.html", 2500);
        } else {
          show("stateError");
        }
      } catch (err) {
        document.getElementById("errorMsg").textContent = err.message || "Confirmation failed.";
        show("stateError");
      }
    });
  </script>
</body>
</html>
